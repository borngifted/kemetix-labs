<title>Kemetix</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #ffffff; }
  body { display: flex; align-items: center; justify-content: center; }

  /* soft navy glow breathing behind the logo */
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 64% 54% at 50% 46%, rgba(10, 31, 68, 0.10) 0%, rgba(10, 31, 68, 0.04) 45%, rgba(10, 31, 68, 0) 72%);
    animation: glowPulse 9s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.06); }
  }

  .stage {
    display: flex; flex-direction: column; align-items: center;
    animation: floaty 11s ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
